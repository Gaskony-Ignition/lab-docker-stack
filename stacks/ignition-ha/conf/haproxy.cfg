# The single front door for the redundant pair.
#
# Ignition has no built-in answer to this and says so: a browser pointed at one
# URL cannot know where the backup is without something in front to send it
# there, and Inductive Automation's position is that HTTP load balancing is a
# solved problem they will not try to improve on. Their recommendation is an
# external reverse proxy in ACTIVE-PASSIVE, choosing the half that reports
# itself active on /system/gwinfo.
#
# Why HAProxy and not the Nginx Proxy Manager already in this stack: NPM emits
#   proxy_pass $forward_scheme://$server:$port$request_uri;
# and nginx does not consult `upstream` blocks when proxy_pass is built from
# variables, so the obvious upstream-with-a-backup-server never takes effect.
# Open-source nginx also cannot health-check a response BODY, which is the whole
# trick below. NPM still owns the routing: ignition.test points here.

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode    http
    log     global
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # A Perspective session is a websocket. Once upgraded, the connection is a
    # tunnel and `timeout client`/`server` no longer govern it -- leave this at
    # the default 0 and an idle session is cut at the client timeout instead,
    # which looks exactly like the gateway dropping the session.
    timeout tunnel  1h

frontend ignition_in
    bind :8088
    default_backend ignition_pair

backend ignition_pair
    balance first

    # THE POINT OF THE WHOLE FILE. Both halves are up and both answer 200 on
    # /system/gwinfo, so "is it listening" is useless here -- it cannot tell an
    # active master from one that has HANDED OVER and is now Warm. This demo's
    # own "Hand over to the standby" button does exactly that, with nothing
    # stopping and nothing to notice. Matching the ROLE STRING in the body
    # follows a planned handover as readily as a crash, and it is the check
    # Inductive Automation point at for this.
    #
    #   master  ... RedundantNodeActiveStatus=Active ...
    #   backup  ... RedundantNodeActiveStatus=Warm   ...
    #
    # /system/gwinfo needs no credentials, which is what lets a proxy use it.
    # The `hdr Host` is NOT optional and its absence does not look like a
    # missing header: HAProxy sends no Host of its own, Ignition's Jetty answers
    # 400 Bad Request, and the check reports "HTTP content check did not match"
    # -- which reads as a wrong match string, or as a gateway that has stopped
    # reporting its role. Both halves went DOWN together, which is the tell:
    # the request never reached the part that differs between them.
    option httpchk
    http-check send meth GET uri /system/gwinfo hdr Host ignition.test

    # AND THE HALF THAT ANSWERS MUST BE IN THIS PAIR. `Active` alone is not a
    # test of that: a gateway with no redundancy at all reports
    # `RedundancyStatus=Independent` and `RedundantNodeActiveStatus=Active`,
    # because from its own point of view it is the one in charge. So every
    # Ignition container on the network passes the check -- including both
    # EDGES.
    #
    # That is not hypothetical. Measured 31/08/2026: the front door was serving
    # ignition-edge1 and answering `project "GatewayAdmin" does not exist`,
    # while the stats page showed a healthy backend and the real pair was
    # perfectly paired. It reads as a broken deploy, or as a failover that lost
    # the projects; it is neither. Pairing the check with the DNS fix below
    # closes it from both ends -- HAProxy follows the right container, and a
    # wrong one could not pass anyway.
    http-check expect ! string RedundancyStatus=Independent
    http-check expect string RedundantNodeActiveStatus=Active

    # `rise 1` so the survivor is taken into service on its FIRST good check --
    # the failover is the thing being demonstrated and a second 2s round trip is
    # two seconds of a blank browser. `fall 2` keeps a single dropped check from
    # flapping the pair.
    #
    # init-addr: HAProxy resolves server names once at startup and REFUSES TO
    # START if one does not resolve. Both gateways are separate compose stacks,
    # so either can legitimately be absent when this comes up -- without this,
    # the proxy for a redundant pair is itself a single point of failure at boot.
    #
    # `resolvers docker` is what keeps that first answer from becoming a lie.
    # Without it HAProxy resolves each name ONCE and talks to that address for
    # the life of the process -- see the resolvers section below for what that
    # cost on 31/08/2026.
    default-server inter 2s fall 2 rise 1 init-addr last,libc,none resolvers docker

    server master ignition:8088        check
    server backup ignition-backup:8088 check

# Docker's embedded DNS, so the two names above are re-resolved while HAProxy
# runs rather than once at its startup.
#
# WHY: Docker gives a restarted container whatever address is free, and these
# gateways restart routinely -- the redundancy demo stops one from a button,
# `make up` after a `make down` re-creates all of them -- while this proxy is a
# separate stack that stays up across all of it. A cached address therefore does
# not merely go stale, it eventually belongs to SOMEBODY ELSE. On 31/08/2026 it
# belonged to ignition-edge1: the front door answered `project "GatewayAdmin"
# does not exist` with a healthy-looking stats page and a correctly paired pair
# behind it.
#
# The hold timers are short deliberately. The long defaults suit a stable DNS
# zone; this one changes exactly when a container restarts, which is precisely
# the moment the front door has to follow it.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid   5s
    hold other   5s
    hold refused 5s
    hold nx      5s
    hold timeout 5s

# Read-only, no credentials, and worth having: it names which half is in service
# and why the other one is not, which is the question being asked whenever
# anyone looks at this at all.
listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
